name: Test and publish verified releases
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: twintrade-release
  cancel-in-progress: false
jobs:
  verify-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Source regression tests
        run: bash test.sh
      - name: Read-only live Gains price socket probe
        run: java -cp 'build/native-tests:libs/*' LivePriceSocketProbe
      - name: Browser dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Mobile browser controls and rotation
        run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-qa
          path: build/mobile-qa.png
      - name: Release integrity
        run: python3 tools/verify-release.py
      - name: Verify compiled APK signatures and alignment
        run: |
          bt="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          for apk in releases/*/TwinTrade.apk; do
            "$bt/apksigner" verify --verbose "$apk"
            "$bt/zipalign" -c -p 4 "$apk"
          done
      - name: Publish releases in their declared order
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/publish-releases.py
