name: Test and publish verified releases
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: twintrade-release
  cancel-in-progress: false
jobs:
  verify-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Source regression tests
        run: |
          for test in tests/*.test.cjs; do node "$test"; done
          for script in app/src/main/assets/*.js; do node --check "$script"; done
          if [ -f test.sh ]; then bash test.sh; fi
      - name: Release integrity
        run: python3 tools/verify-release.py
      - name: Verify compiled APK signatures and alignment
        run: |
          bt="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          for apk in releases/*/TwinTrade.apk; do
            "$bt/apksigner" verify --verbose "$apk"
            "$bt/zipalign" -c -p 4 "$apk"
          done
      - name: Publish releases in their declared order
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/publish-releases.py
